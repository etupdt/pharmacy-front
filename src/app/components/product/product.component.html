<ion-content>
  <div class="views">
    <app-product-card [productCard]="getProduct" [displayIcon]="'disable'"></app-product-card>
    <app-product-view-card></app-product-view-card>
  </div>
  
  <div class="product">
    <ion-list>
      <ion-item lines="none">
        <h3>Saisissez les données du produit</h3>
      </ion-item>
      <div class="image-setting">
        <div class="div-cropper">
          <div class="champs">
            <ion-item lines="none">
              <ion-input
              [value]="getProduct.getPreparationTime"
              (ionInput)="onChangePreparationTime($event)"
              label="Temps nécessaire à la préparation du colis"
              labelPlacement="stacked"
              placeholder="Temps nécessaire à la préparation"
              fill="solid"
              type="text"
              required
              ></ion-input>
            </ion-item>
            <ion-item lines="none">
              <ion-input
              [value]="getProduct.getCommandTime"
              (ionInput)="onChangeCommandTime($event)"
              label="Temps de la commande"
              labelPlacement="stacked"
              placeholder="Temps de la commande"
              fill="solid"
              type="text"
              required
              ></ion-input>
            </ion-item>
            <ion-item lines="none">
              <ion-input
              [value]="getProduct.getDeliveryTime"
              (ionInput)="onChangeDeliveryTime($event)"
              label="Temps d'acheminement"
              labelPlacement="stacked"
              placeholder="Temps d'acheminement"
              fill="solid"
              type="text"
              required
              ></ion-input>
            </ion-item>
          </div>
          <image-cropper
            [imageChangedEvent]="imageChangedEvent"
            [output]="'blob'"
            [imageFile]="imageFile"
            [maintainAspectRatio]="true"
            [aspectRatio]="1 / 1"
            [resizeToWidth]="400"
            [cropperMinWidth]="34"
            [onlyScaleDown]="true"
            [transform]="transform"
            [roundCropper]="false"
            [alignImage]="'left'"
            [style.display]="showCropper ? null : 'none'"
            format="webp"
            (imageCropped)="imageCropped($event)"
            (imageLoaded)="imageLoaded($event)"
            (cropperReady)="cropperReady($event)"
            (loadImageFailed)="loadImageFailed()"
          ></image-cropper>
          <div lines="none" class="image-buttons">
            <ion-icon name="arrow-up-outline" (click)="fileInput.click()"></ion-icon>
            <input type="file" #fileInput (change)="fileChangeEvent($event)" hidden/>
            <ion-icon name="pencil-outline" (click)="replaceImage()"></ion-icon>
            <ion-icon name="add-circle-outline" (click)="zoomIn()"></ion-icon>
            <ion-icon name="remove-circle-outline" (click)="zoomOut()"></ion-icon>
            <ion-icon name="refresh-outline" (click)="reinitImage()"></ion-icon>
            <ion-icon name="close-outline" (click)="cancel()"></ion-icon>
          </div>
        </div>
      </div>
      <ion-item lines="none">
        <div class="page-buttons">
          <app-button 
            class="add-product"
            [callback]="cancel.bind(this)"
            text="Abandonner"
          ></app-button>
         </div>
      </ion-item>
    </ion-list>
  </div>

</ion-content>
