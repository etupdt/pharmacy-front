
<div class="onsiteservice">
    <div class="image-setting">
      <div class="div-cropper">
        <image-cropper
          [imageChangedEvent]="imageChangedEvent"
          [output]="'blob'"
          [imageFile]="imageFile"
          [maintainAspectRatio]="true"
          [aspectRatio]="aspectRatio"
          [resizeToWidth]="350"
          [cropperMinWidth]="100"
          [onlyScaleDown]="true"
          [transform]="transform"
          [roundCropper]="false"
          [alignImage]="'center'"
          [style.display]="showCropper ? null : 'none'"
          format="webp"
          (imageCropped)="imageCropped($event)"
          (imageLoaded)="imageLoaded($event)"
          (cropperReady)="cropperReady($event)"
          (loadImageFailed)="loadImageFailed()"
        ></image-cropper>
      </div>
      <div lines="none" class="image-buttons">
        <ion-icon 
          name="arrow-up-outline" 
          alt="Télécharger une image"
          title="Télécharger une image"
          (click)="fileInput.click()"
        ></ion-icon>
        <input type="file" #fileInput (change)="fileChangeEvent($event)" hidden/>
        <ion-icon 
          name="pencil-outline" 
          alt="Valider l'image"
          title="Valider l'image"
          (click)="replaceImage()"
        ></ion-icon>
        <ion-icon 
          name="add-circle-outline" 
          alt="Zoom avant"
          title="Zoom avant"
          (click)="zoomIn()"
        ></ion-icon>
        <ion-icon 
          name="remove-circle-outline" 
          alt="Zoom arrière"
          title="Zoom arrière"
          (click)="zoomOut()"
        ></ion-icon>
        <ion-icon 
          name="refresh-outline" 
          alt="Retour à l'image initiale"
          title="Retour à l'image initiale"
          (click)="reinitImage()"
        ></ion-icon>
        <ion-icon 
          name="close-outline" 
          alt="Abandon"
          title="Abandon"
          (click)="cancel()"
        ></ion-icon>
      </div>
    </div>
  </div>
